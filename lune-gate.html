<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بوابة الفريق — LUNE</title>
  <link rel="stylesheet" href="style.css" />
  <script>const API_BASE = '';</script>
</head>
<body>

<div id="app"></div>

<script>
const PORTAL_API = API_BASE + '/api/staff/portal-login';
const SUBS_API   = API_BASE + '/api/submissions';

let staffName = null;
let submissions = [];
let filter = 'all';
let search = '';
let selected = null;
let pollTimer = null;

// ══ RENDER ══════════════════════════════════════════
function render() {
  document.getElementById('app').innerHTML = staffName ? dashboardHtml() : loginHtml();
  attachEvents();
}

// ── Login ────────────────────────────────────────────
function loginHtml() {
  return `
    <div class="login-wrap">
      <div class="login-glow"></div>
      <div class="login-card" id="loginCard">
        <div class="login-icon">
          <svg style="width:28px;height:28px;stroke:var(--gold);fill:none;" viewBox="0 0 24 24" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/>
          </svg>
        </div>
        <div style="text-align:center;margin-bottom:32px;">
          <h1 style="font-size:22px;color:#fff;margin-bottom:4px;">بوابة الفريق</h1>
          <p style="color:rgba(255,255,255,0.40);font-size:14px;">أدخل كزدك الخاص للدخول</p>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div style="position:relative;">
            <svg style="position:absolute;top:50%;transform:translateY(-50%);right:16px;width:14px;height:14px;stroke:rgba(255,255,255,0.40);fill:none;" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 8.25h15m-16.5 7.5h15m-1.8-13.5l-3.9 19.5m-2.1-19.5l-3.9 19.5"/></svg>
            <input type="text" id="kazdInput" class="input"
              placeholder="الكزد الخاص بك"
              style="padding-right:44px;font-family:monospace;letter-spacing:0.05em;"
              onkeydown="if(event.key==='Enter')attemptLogin()" />
          </div>
          <div id="loginError" class="error-msg" style="display:none;"></div>
          <button class="btn-gold btn-h12" style="width:100%;margin-top:4px;" onclick="attemptLogin()" id="loginBtn">
            دخول
          </button>
        </div>
      </div>
    </div>`;
}

async function attemptLogin() {
  const kazd = document.getElementById('kazdInput').value.trim();
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  const card = document.getElementById('loginCard');
  if (!kazd) { showError('أدخل الكزد'); return; }
  btn.disabled = true; btn.textContent = '...';
  errEl.style.display = 'none';
  try {
    const res = await fetch(PORTAL_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kazd }),
    });
    const data = await res.json();
    if (data.match) {
      staffName = data.name;
      await loadSubmissions();
      render();
      return;
    }
    showError('الكزد غير صحيح، تحقق منه وحاول مجدداً');
    card.classList.add('shake');
    setTimeout(() => card.classList.remove('shake'), 600);
  } catch { showError('تعذر الاتصال، حاول مجدداً'); }
  finally { btn.disabled = false; btn.textContent = 'دخول'; }
}

function showError(msg) {
  const el = document.getElementById('loginError');
  if (el) { el.textContent = msg; el.style.display = 'block'; }
}

// ── Dashboard ────────────────────────────────────────
function dashboardHtml() {
  const filtered = getFiltered();
  const passedCnt = submissions.filter(s => s.passed).length;

  return `
    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-inner">
        <div class="flex items-center gap-3">
          <svg style="width:18px;height:18px;stroke:var(--gold);fill:none;" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/></svg>
          <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;color:#fff;letter-spacing:0.12em;">LUNE</span>
          <span style="color:rgba(255,255,255,0.40);font-size:14px;">/ ${staffName}</span>
        </div>
        <button onclick="logout()" style="display:flex;align-items:center;gap:8px;font-size:14px;color:rgba(255,255,255,0.50);cursor:pointer;" class="btn-ghost" style="padding:8px 14px;">
          <svg style="width:14px;height:14px;stroke:currentColor;fill:none;" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/></svg>
          خروج
        </button>
      </div>
    </div>

    <!-- Content -->
    <div style="max-width:1000px;margin:0 auto;padding:32px 24px 64px;">
      <div class="flex items-center gap-2" style="margin-bottom:24px;">
        <svg style="width:18px;height:18px;stroke:var(--gold);fill:none;" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z"/></svg>
        <h2 style="font-size:17px;font-weight:700;color:#fff;">طلبات الانضمام</h2>
      </div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-value" style="color:var(--gold);">${submissions.length}</div><div class="stat-label">إجمالي</div></div>
        <div class="stat-card"><div class="stat-value" style="color:var(--green);">${passedCnt}</div><div class="stat-label">ناجح</div></div>
        <div class="stat-card"><div class="stat-value" style="color:var(--red);">${submissions.length - passedCnt}</div><div class="stat-label">راسب</div></div>
      </div>

      <!-- Controls -->
      <div class="controls-bar">
        <div class="search-wrap" style="flex:1;">
          <svg viewBox="0 0 24 24" stroke-width="2" style="stroke:rgba(255,255,255,0.40);fill:none;"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 15.803 7.5 7.5 0 0016.803 15.803z"/></svg>
          <input type="text" class="input input-sm search-wrap" id="searchInput" placeholder="ابحث بالاسم..." value="${search}" oninput="search=this.value;selected=null;render();" style="width:100%;padding-right:38px;" />
        </div>
        <button class="filter-btn ${filter==='all'?'active':''}" onclick="filter='all';render();">الكل</button>
        <button class="filter-btn ${filter==='passed'?'active':''}" onclick="filter='passed';render();">ناجح</button>
        <button class="filter-btn ${filter==='failed'?'active':''}" onclick="filter='failed';render();">راسب</button>
        <button class="icon-btn" onclick="loadSubmissions().then(render)" title="تحديث">
          <svg viewBox="0 0 24 24" stroke-width="2" style="stroke:currentColor;fill:none;"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
        </button>
      </div>

      <!-- List + Detail -->
      <div style="display:flex;gap:20px;min-height:380px;">
        <div class="data-table" style="flex:1;">
          ${filtered.length === 0
            ? `<div class="table-empty"><svg viewBox="0 0 24 24" stroke-width="1.5" style="stroke:currentColor;fill:none;"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z"/></svg><span>لا توجد طلبات</span></div>`
            : filtered.map(s => `
              <button class="subs-list-row ${selected && selected.id===s.id ? 'active' : ''}" onclick="selected=submissions.find(x=>x.id==='${s.id}');render();">
                <div>
                  <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px;">
                    <span style="color:#fff;font-weight:600;font-size:14px;">${s.name}</span>
                    <span style="color:rgba(255,255,255,0.35);font-size:12px;">·</span>
                    <span style="color:rgba(255,255,255,0.50);font-size:12px;">${s.charName}</span>
                  </div>
                  <div style="font-size:12px;color:rgba(255,255,255,0.35);">${new Date(s.submittedAt).toLocaleString('ar-SA')}</div>
                </div>
                ${s.passed
                  ? `<svg style="width:18px;height:18px;stroke:var(--green);fill:none;flex-shrink:0;" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`
                  : `<svg style="width:18px;height:18px;stroke:var(--red);fill:none;flex-shrink:0;" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`}
              </button>`).join('')}
        </div>
        ${selected ? detailPanelHtml(selected) : ''}
      </div>
    </div>`;
}

function detailPanelHtml(s) {
  return `
    <div class="detail-panel">
      <span class="badge ${s.passed ? 'badge-green' : 'badge-red'}" style="margin-bottom:16px;display:inline-flex;">${s.passed ? 'ناجح' : 'راسب'}</span>
      <div class="detail-field"><div class="lbl">الاسم</div><div class="val">${s.name}</div></div>
      <div class="detail-field"><div class="lbl">العمر</div><div class="val">${s.age}</div></div>
      <div class="detail-field"><div class="lbl">اسم الشخصية</div><div class="val">${s.charName}</div></div>
      <div class="divider"></div>
      <div style="font-size:11px;color:rgba(255,255,255,0.45);margin-bottom:8px;">إجابات الاختبار</div>
      <div class="answer-row">
        <div><div class="qlbl">RDM</div><div class="qval">${s.rdm}</div></div>
        ${s.rdmCorrect ? iconCheck() : iconX()}
      </div>
      <div class="answer-row">
        <div><div class="qlbl">VDM</div><div class="qval">${s.vdm}</div></div>
        ${s.vdmCorrect ? iconCheck() : iconX()}
      </div>
      <div style="font-size:11px;color:rgba(255,255,255,0.35);margin-top:12px;">${new Date(s.submittedAt).toLocaleString('ar-SA')}</div>
    </div>`;
}

function iconCheck() { return `<svg style="width:14px;height:14px;stroke:var(--green);fill:none;flex-shrink:0;" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>`; }
function iconX()     { return `<svg style="width:14px;height:14px;stroke:var(--red);fill:none;flex-shrink:0;" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>`; }

function getFiltered() {
  return submissions.filter(s => {
    const okF = filter === 'all' ? true : filter === 'passed' ? s.passed : !s.passed;
    const q = search.trim().toLowerCase();
    const okQ = !q || s.name.toLowerCase().includes(q) || s.charName.toLowerCase().includes(q);
    return okF && okQ;
  });
}

async function loadSubmissions() {
  try {
    const res = await fetch(SUBS_API);
    const data = await res.json();
    submissions = data.sort((a,b) => new Date(b.submittedAt) - new Date(a.submittedAt));
  } catch { /* silent */ }
}

function logout() {
  staffName = null; submissions = []; selected = null;
  clearInterval(pollTimer);
  render();
}

function attachEvents() {
  if (staffName && !pollTimer) {
    pollTimer = setInterval(() => loadSubmissions().then(render), 8000);
  }
  if (!staffName) clearInterval(pollTimer);
}

render();
</script>
</body>
</html>
